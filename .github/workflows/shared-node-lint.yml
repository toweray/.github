name: Lint

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version
        required: false
        type: string
        default: '24.x'
      biome-version:
        description: Biome version
        required: false
        type: string
        default: latest

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: toweray/.github/.github/actions/setup-node@master
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: ${{ inputs.biome-version }}

      - name: Run Biome
        run: biome ci
